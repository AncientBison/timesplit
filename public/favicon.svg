<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clock face -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="2"/>
  
  <!-- Clock hands forming a "split" -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="42" y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#fff"/>
  
  <!-- Split indicator lines -->
  <line x1="0" y1="0" x2="64" y2="64" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>